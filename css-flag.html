<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Flag — Hreeday</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f1f4f6;color:#202832;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(700px,100%);background:white;padding:32px;border-radius:18px;box-shadow:0 20px 60px #15243618;text-align:center}.flag{width:min(480px,100%);aspect-ratio:3/2;margin:26px auto;display:flex;flex-direction:column;box-shadow:0 15px 35px #1113}.red{height:25%;background:#ce1126}.blue{height:50%;background:#002868;display:grid;place-items:center}.circle{width:min(132px,35%);aspect-ratio:1;border-radius:50%;background:white}.note{color:#647180}.back{color:#234879}
  </style>
</head>
<body>
  <main class="card">
    <a class="back" href="index.html">← Back to Hreeday’s portfolio</a>
    <h1>CSS Flag Practice</h1>
    <p class="note">A flag design made from colored sections and a circle using CSS.</p>
    <div class="flag" role="img" aria-label="Red, blue, and red horizontal bands with a white circle in the center">
      <div class="red"></div><div class="blue"><div class="circle"></div></div><div class="red"></div>
    </div>
    <p><small>Made by Hreeday · HTML structure styled with CSS.</small></p>
  </main>
</body>
</html>
