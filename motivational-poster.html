<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motivational Poster — Hreeday</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;background:#101312;color:#f5f1e8;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.poster{width:min(620px,100%);padding:22px;background:#d4f36c;color:#172018;text-align:center;box-shadow:0 28px 80px #0008}.photo{height:320px;background:linear-gradient(150deg,#243f33,#507a59 48%,#c2d68a);display:grid;place-items:center;position:relative;overflow:hidden}.sun{width:120px;height:120px;border-radius:50%;background:#f4d883;box-shadow:0 0 65px #ffe9a677}.hill{position:absolute;bottom:-80px;width:120%;height:190px;border-radius:50% 50% 0 0;background:#203c31;transform:rotate(-8deg)}.hill.second{bottom:-112px;left:-40px;background:#38583d;transform:rotate(8deg)}.message{font-size:clamp(2rem,7vw,3.5rem);line-height:.98;letter-spacing:-.06em;text-transform:uppercase;margin:24px 8px 10px}.sub{font-size:.9rem;letter-spacing:.12em;text-transform:uppercase}.back{display:block;color:#b9c5b9;margin-bottom:20px}@media(max-width:500px){.photo{height:250px}}
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← Back to Hreeday’s portfolio</a>
    <article class="poster"><div class="photo" role="img" aria-label="Sun rising over green hills"><div class="sun"></div><div class="hill"></div><div class="hill second"></div></div><h1 class="message">Small steps.<br>Strong foundations.<br>Big things ahead.</h1><p class="sub">Keep learning · Keep building</p></article>
  </main>
</body>
</html>
