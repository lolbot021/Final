<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mondrian Painting — Hreeday</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f1eb;color:#191a18;font-family:Arial,sans-serif;display:grid;place-items:center;padding:28px}.page{width:min(760px,100%)}.back{color:#465347}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:26px 0 18px}.heading h1{font-size:clamp(2rem,6vw,3.4rem);margin:0;letter-spacing:-.07em}.heading p{max-width:270px;color:#59605a;line-height:1.5;margin:0}.painting{height:min(66vw,480px);min-height:330px;background:#171717;border:8px solid #171717;display:grid;gap:8px;grid-template-columns:1.25fr 1.1fr .42fr .12fr;grid-template-rows:1fr 1.15fr .45fr .22fr;grid-template-areas:"a red red yellow" "blue red red yellow" "blue b b yellow" "blue c c d"}.tile{background:#f6f4ee}.red{grid-area:red;background:#d33d30}.blue{grid-area:blue;background:#17499a}.yellow{grid-area:yellow;background:#e8c64c}.w1{grid-area:a}.w2{grid-area:b}.w3{grid-area:c}.w4{grid-area:d}.caption{color:#626960;font-size:.85rem;margin-top:14px}@media(max-width:520px){body{padding:18px}.heading{display:block}.heading p{margin-top:10px}.painting{min-height:300px;height:75vw;gap:6px;border-width:6px;grid-template-columns:1.1fr 1fr .45fr .15fr}}
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← Back to Hreeday’s portfolio</a>
    <header class="heading"><h1>Mondrian Painting</h1><p>A geometric composition made with CSS Grid, colored blocks, and bold lines.</p></header>
    <div class="painting" role="img" aria-label="Abstract grid painting with red, blue, yellow, and white blocks"><div class="tile w1"></div><div class="tile red"></div><div class="tile blue"></div><div class="tile yellow"></div><div class="tile w2"></div><div class="tile w3"></div><div class="tile w4"></div></div>
    <p class="caption">Practice project · CSS Grid layout</p>
  </main>
</body>
</html>
